services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coderouter
      POSTGRES_USER: coderouter
      POSTGRES_PASSWORD: coderouter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderouter"]
      interval: 5s
      timeout: 5s
      retries: 5

  coderouter:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://coderouter:coderouter@postgres:5432/coderouter?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32bytes!}
      PORT: "8080"
      # BYOK bootstrap: these are encrypted into provider_keys on startup.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ROUTING_MODE: ${ROUTING_MODE:-auto}
      ROUTING_OBJECTIVE: ${ROUTING_OBJECTIVE:-balanced}
      # The first operator account, read only when no account exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # A shared token for scripts; people sign in with the email above.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_THRESHOLD: ${CACHE_THRESHOLD:-0.95}
      CACHE_TTL: ${CACHE_TTL:-24h}
      CACHE_MAX_TEMPERATURE: ${CACHE_MAX_TEMPERATURE:-0.3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      PROVIDERS: ${PROVIDERS:-}
      FREE_ONLY: ${FREE_ONLY:-false}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-24h}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-6h}
      PROBE_INTERVAL: ${PROBE_INTERVAL:-6h}
      PROBE_MODELS_PER_PROVIDER: ${PROBE_MODELS_PER_PROVIDER:-3}
      PROBE_FRESHNESS: ${PROBE_FRESHNESS:-24h}
      MODEL_CATALOG: ${MODEL_CATALOG:-}
      LATENCY_FEEDBACK_INTERVAL: ${LATENCY_FEEDBACK_INTERVAL:-5m}
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-coderouter/v1}
      IOT_EDGE_ENDPOINT: ${IOT_EDGE_ENDPOINT:-}
      IOT_API_KEY: ${IOT_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Opt-in broker for local IoT testing: docker compose --profile iot up
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    ports:
      - "1883:1883"
    command: >
      sh -c "printf 'listener 1883\\nallow_anonymous true\\n' > /mosquitto/config/mosquitto.conf
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"

volumes:
  pgdata:
