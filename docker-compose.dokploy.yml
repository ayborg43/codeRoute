# Dokploy Compose deployment.
#
# Differences from docker-compose.yml: Postgres publishes no host port, both
# services restart automatically, and the gateway joins dokploy-network so
# Traefik can route to it. Set the variables from .env.example in Dokploy's
# Environment tab.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coderouter
      POSTGRES_USER: coderouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:` — the database is reachable only on the
    # internal network, never from the public interface.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderouter"]
      interval: 5s
      timeout: 5s
      retries: 10

  coderouter:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://coderouter:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/coderouter?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY to a 16, 24, or 32 byte value}
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ROUTING_MODE: ${ROUTING_MODE:-auto}
      ROUTING_OBJECTIVE: ${ROUTING_OBJECTIVE:-balanced}
      # The first operator account, read only when no account exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # A shared token for scripts; people sign in with the email above.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_THRESHOLD: ${CACHE_THRESHOLD:-0.95}
      CACHE_TTL: ${CACHE_TTL:-24h}
      CACHE_MAX_TEMPERATURE: ${CACHE_MAX_TEMPERATURE:-0.3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      PROVIDERS: ${PROVIDERS:-}
      FREE_ONLY: ${FREE_ONLY:-false}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-24h}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-6h}
      MODEL_CATALOG: ${MODEL_CATALOG:-}
      LATENCY_FEEDBACK_INTERVAL: ${LATENCY_FEEDBACK_INTERVAL:-5m}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-coderouter/v1}
      IOT_EDGE_ENDPOINT: ${IOT_EDGE_ENDPOINT:-}
      IOT_API_KEY: ${IOT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      # Remove these if you attach the domain through Dokploy's UI instead,
      # which injects its own labels. Adjust certresolver to match your setup.
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.coderouter.rule=Host(`${DOMAIN:?set DOMAIN}`)
      - traefik.http.routers.coderouter.entrypoints=websecure
      - traefik.http.routers.coderouter.tls.certresolver=letsencrypt
      - traefik.http.services.coderouter.loadbalancer.server.port=8080

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  pgdata:
